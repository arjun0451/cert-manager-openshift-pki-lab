---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-calling
  namespace: calling-ns
  labels:
    app: pki-lab
    component: calling
    tier: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-calling
      component: calling
  template:
    metadata:
      labels:
        app: nginx-calling
        component: calling
        version: v1
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nginx-calling
              topologyKey: kubernetes.io/hostname

      containers:
      - name: nginx
        image: quay.io/nginx/nginx-unprivileged:stable-perl
        imagePullPolicy: IfNotPresent

        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: TZ
          value: "UTC"

        volumeMounts:
        - name: server-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        - name: ca-bundle
          mountPath: /etc/nginx/trust
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run/nginx
        - name: nginx-tmp
          mountPath: /tmp

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 10

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

      volumes:
      - name: server-certs
        secret:
          secretName: calling-app-tls-secret
          defaultMode: 0440
      - name: ca-bundle
        configMap:
          name: pki-trust-bundle
          items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
          defaultMode: 0444
      - name: nginx-config
        configMap:
          name: nginx-config-calling
          defaultMode: 0644
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}

      terminationGracePeriodSeconds: 30
